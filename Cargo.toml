[workspace]
members = ["lints/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
dylint_linting = "6.3.2"
dylint_testing = "6.3.2"
bevy_app = { version = "0.20.0", default-features = false }
bevy_ecs = { version = "0.20.0", default-features = false }
bevy_input = { version = "0.20.0", default-features = false, features = ["std", "keyboard", "mouse", "gamepad"] }

[workspace.lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(dylint_lib, values(any()))']
